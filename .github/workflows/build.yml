name: Build RK Apps APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Siapkan kunci tanda tangan (jika secret tersedia)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/rkapps.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/rkapps.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret KEYSTORE_BASE64 belum diisi - APK memakai kunci debug (ganti tiap build)."
          fi
      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk RK-Apps.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RK-Apps-APK
          path: RK-Apps.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: RK Apps (terbaru)
          body: Unduh RK-Apps.apk di bawah, lalu pasang di HP Android.
          files: RK-Apps.apk
